name: Build Android APK and iOS

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Debug Keystore on the fly
        run: |
          mkdir -p $HOME/.android
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp debug.keystore $HOME/.android/debug.keystore

      - name: Ensure Gradle Wrapper 9.3.1
        run: gradle wrapper --gradle-version 9.3.1

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SpaceDodger-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  build-ios:
    name: Build iOS Binary
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Ensure Gradle Wrapper 9.3.1
        run: gradle wrapper --gradle-version 9.3.1

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build iOS Framework / App
        run: |
          cd iosApp
          xcodebuild clean build -project iosApp.xcodeproj -scheme iosApp -configuration Release -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ONLY_ACTIVE_ARCH=YES ENABLE_USER_SCRIPT_SANDBOXING=NO

      - name: 🚀 Radical Package & Size Check
        run: |
          cd ${{ github.workspace }}
          echo "🔍 Recherche de la plus grosse application générée..."
          # Trouve le plus gros dossier .app du système
          LARGEST_APP=$(find . -name "*.app" -type d -exec du -sm {} + | sort -n | tail -1 | cut -f2 | xargs)
          
          if [ -z "$LARGEST_APP" ]; then
            echo "🚨 ERREUR : Absolument aucun dossier .app trouvé !"
            exit 1
          fi
          
          echo "Dossier ciblé : $LARGEST_APP"
          SIZE=$(du -sm "$LARGEST_APP" | cut -f1)
          echo "Poids mesuré : $SIZE Mo"
          
          # Si l'app pèse moins de 5 Mo, c'est une coquille vide
          if [ "$SIZE" -lt 5 ]; then
            echo "🚨 ERREUR FATALE : L'application est vide ($SIZE Mo) ! Xcode a échoué silencieusement ou le binaire n'a pas été lié."
            echo "Contenu du dossier fantôme :"
            ls -la "$LARGEST_APP"
            exit 1
          fi
          
          echo "📦 Application valide ! Emballage en cours..."
          mkdir -p Payload
          cp -R "$LARGEST_APP" Payload/
          zip -q -r SpaceDodger-iOS.ipa Payload
          echo "✅ Fichier IPA généré avec succès !"
          ls -lh SpaceDodger-iOS.ipa

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: SpaceDodger-iOS-IPA
          path: SpaceDodger-iOS.ipa
