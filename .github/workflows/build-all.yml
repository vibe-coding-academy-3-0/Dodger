name: Build Android APK and iOS

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Debug Keystore on the fly
        run: |
          mkdir -p $HOME/.android
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp debug.keystore $HOME/.android/debug.keystore

      - name: Ensure Gradle Wrapper 9.3.1
        run: gradle wrapper --gradle-version 9.3.1

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SpaceDodger-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  build-ios:
    name: Build iOS Binary
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Ensure Gradle Wrapper 9.3.1
        run: gradle wrapper --gradle-version 9.3.1

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: 🔨 Force KMP Framework Compilation
        run: |
          ./gradlew :app:linkReleaseFrameworkIosArm64 --no-configuration-cache
          chmod +x scripts/prepare_ios_framework.sh
          ./scripts/prepare_ios_framework.sh iphoneos

      - name: 🍏 Build Unsigned iOS App
        run: |
          cd iosApp
          xcodebuild clean build -project iosApp.xcodeproj -scheme iosApp -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO ENABLE_USER_SCRIPT_SANDBOXING=NO

      - name: 📦 Package Unsigned IPA
        run: |
          cd ${{ github.workspace }}
          echo "🔍 Recherche du dossier .app généré par Xcode..."
          APP_PATH=$(find . $HOME/Library/Developer/Xcode/DerivedData -name "*.app" -type d 2>/dev/null | head -1)
          
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "🚨 ERREUR : Aucun dossier .app trouvé après la compilation !"
            exit 1
          fi
          
          echo "Dossier .app trouvé : $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -q -r SpaceDodger-Unsigned.ipa Payload
          echo "✅ Archive SpaceDodger-Unsigned.ipa créée avec succès !"
          ls -lh SpaceDodger-Unsigned.ipa
          du -sh SpaceDodger-Unsigned.ipa

      - name: 🚀 Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: SpaceDodger-Unsigned-IPA
          path: SpaceDodger-Unsigned.ipa
          retention-days: 14
