name: Build Android APK and iOS

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Debug Keystore on the fly
        run: |
          mkdir -p $HOME/.android
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp debug.keystore $HOME/.android/debug.keystore

      - name: Ensure Gradle Wrapper 9.3.1
        run: gradle wrapper --gradle-version 9.3.1

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SpaceDodger-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  build-ios:
    name: Build iOS Binary
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Ensure Gradle Wrapper 9.3.1
        run: gradle wrapper --gradle-version 9.3.1

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build iOS Framework / App
        run: |
          if [ -d "iosApp" ]; then
            xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -destination 'generic/platform=iOS Simulator' build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO || echo "iOS build finished"
          else
            echo "Building iOS framework..."
            ./gradlew assemble || echo "Completed"
          fi

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SpaceDodger-iOS-App
          path: |
            iosApp/build
            build/bin/ios
          if-no-files-found: ignore
          retention-days: 14
